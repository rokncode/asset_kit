name: asset_kit
description: >-
  CLI that manages Flutter assets: converts images to WebP with 2x/3x
  variants, generates type-safe constants, syncs pubspec.yaml and finds
  unused assets.
version: 0.1.0
repository: https://github.com/rokncode/asset_kit
issue_tracker: https://github.com/rokncode/asset_kit/issues
topics:
  - flutter
  - assets
  - codegen
  - images
  - cli

environment:
  sdk: ^3.11.0

executables:
  asset_kit: asset_kit
dependencies:
  args: ^2.7.0
  crypto: ^3.0.8
  dart_style: ^3.0.0
  glob: ^2.2.0
  image: ^4.13.1
  path: ^1.9.1
  pub_semver: ^2.2.1
  watcher: ^1.2.1
  xml: ">=7.0.1 <8.0.0"
  yaml: ^3.1.4
  yaml_edit: ^2.2.4
dev_dependencies:
  # Not used directly: older versions can't find the AOT frontend server
  # snapshot of current SDKs, which breaks `dart test` after
  # `dart pub downgrade` (see the CI job for the minimum SDK).
  frontend_server_client: ^4.0.0
  lints: ^6.1.0
  test: ^1.33.0
  vector_graphics_compiler: ^1.1.0
